name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# GitHub Runner 在海外：把 Loom 端点改回官方源（本地 gradle.properties 指向 BMCLAPI）。
# `loom_libraries_base` 必须是 libraries.minecraft.net：它负责 com.mojang:*
# （brigadier、datafixerupper 等），maven.fabricmc.net 并不提供这些构件。
# 两个 job 共用一份参数，改地址只改这里。
env:
  LOOM_ARGS: >-
    -Ploom_libraries_base=https://libraries.minecraft.net/
    -Ploom_resources_base=https://resources.download.minecraft.net/
    -Ploom_version_manifests=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 纯静态检查：JSON 语法 + 语言文件键成对。资源错误通常在加载时才炸，
      # 这一步把它提前到编译阶段，成本只有几秒。
      - name: Validate resources
        run: |
          set -euo pipefail
          find src -name '*.json' -print0 | while IFS= read -r -d '' f; do
            jq empty "$f" || { echo "invalid JSON: $f"; exit 1; }
          done
          python3 - <<'PY'
          import json, sys
          def keys(path):
              with open(path, encoding='utf-8') as fh:
                  return set(json.load(fh))
          zh = keys('src/main/resources/assets/hush/lang/zh_cn.json')
          en = keys('src/main/resources/assets/hush/lang/en_us.json')
          diff = zh ^ en
          if diff:
              print('lang key mismatch:', sorted(diff))
              sys.exit(1)
          print(f'lang keys ok: {len(zh)}')
          PY

      # build 会跑 check + test，CombatProfileTest / AngerLedgerTest 挂了这里就红。
      - name: Build and test
        run: ./gradlew build --stacktrace $LOOM_ARGS

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hush-jar
          # 只发可玩包：-sources.jar 对使用者无意义，排除后 artifact 只有一份主 jar。
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/test-results
          if-no-files-found: ignore

  # 无头服务端冒烟：编译通过不代表能加载。Mixin 目标、实体类型注册、数据包命令
  # 都只在运行时校验，这一 job 把「启动即崩」暴露在 PR 上。
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 只改文档的 PR 不跑服务端：省一分钟；代码 PR 只是多一次全量 checkout。
      # 判断失败时 run 保持 true，宁可多跑也不漏跑。
      - name: Decide whether smoke is needed
        id: decide
        run: |
          run=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" 2>/dev/null || true)
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(docs/|.*\.md$)'; then
              run=false
              echo "docs-only change, skip smoke"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Prepare headless server
        if: steps.decide.outputs.run == 'true'
        run: |
          mkdir -p run/smoke/datapacks
          cp -r ci/smoke-datapack run/smoke/datapacks/hush-smoke
          # 假玩家由 Carpet 提供：只进测试环境，不参与模组依赖
          python3 ci/fetch_carpet.py
          printf 'eula=true\n' > run/eula.txt
          printf 'level-name=smoke\nlevel-type=minecraft:flat\nonline-mode=false\nmax-tick-time=-1\nspawn-protection=0\nenable-rcon=true\nrcon.port=25575\nrcon.password=hush-smoke\nbroadcast-rcon-to-ops=false\n' > run/server.properties

      # 冒烟数据包启动后 summon 实体并打印标记；标记出现即通过 RCON 优雅停服，
      # 不必等超时，整步从 ~3 分钟降到 ~1 分钟。超时只是兜底。
      - name: Run dedicated server
        if: steps.decide.outputs.run == 'true'
        env:
          # 假玩家场景需要 [Hush] 调试行；build.gradle 把它传给游戏 JVM
          HUSH_DEBUG: '1'
        run: |
          set -uo pipefail
          LOG=run/logs/latest.log
          rm -f "$LOG" build/smoke-report.txt
          # 数据包先证明「加载期没问题」，再由假玩家场景驱动战斗并用 RCON 停服。
          # 驱动脚本自己会写 build/smoke-report.txt 并发送 stop。
          (
            for _ in $(seq 1 150); do
              if grep -q 'HUSH_SMOKE_DONE' "$LOG" 2>/dev/null; then
                cd ci && python3 fake_player_smoke.py \
                  --log "$GITHUB_WORKSPACE/$LOG" \
                  --report "$GITHUB_WORKSPACE/build/smoke-report.txt"
                exit $?
              fi
              sleep 1
            done
            echo '::warning::HUSH_SMOKE_DONE never appeared, stopping server'
            python3 ci/rcon_stop.py 127.0.0.1 25575 hush-smoke stop || true
            exit 1
          ) &
          WATCHER=$!
          set +e
          timeout 300 ./gradlew runServer --console=plain --stacktrace $LOOM_ARGS
          STATUS=$?
          set -e
          wait "$WATCHER" || true
          echo "server_exit=$STATUS"
          exit "$STATUS"

      - name: Assert smoke markers
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          LOG=run/logs/latest.log
          fail() { echo "::error::$1"; tail -n 60 "$LOG" || true; exit 1; }
          test -f "$LOG" || fail "server log missing"
          grep -q '\[Hush\] 姚永寿已注册' "$LOG" || fail "mod did not initialize"
          grep -q 'HUSH_SMOKE_MOB_OK' "$LOG" || fail "summoned mob missing"
          grep -q 'HUSH_SMOKE_SPIT_OK' "$LOG" || fail "summoned spit missing"
          grep -q 'Stopping server' "$LOG" || fail "server did not stop gracefully"
          ! grep -q 'HUSH_SMOKE_MOB_MISSING' "$LOG" || fail "mob despawned"
          ! grep -q 'HUSH_SMOKE_SPIT_MISSING' "$LOG" || fail "spit despawned"
          ! grep -qi 'mixin apply failed' "$LOG" || fail "mixin apply failed"
          ! grep -q 'Unknown or invalid command' "$LOG" || fail "datapack command invalid"
          ! grep -q 'Failed to load datapack' "$LOG" || fail "datapack failed to load"

      - name: Assert fake player scenario
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          REPORT=build/smoke-report.txt
          fail() { echo "::error::$1"; tail -n 40 "$REPORT" || true; exit 1; }
          test -f "$REPORT" || fail "fake player report missing"
          ! grep -q '^- FAIL' "$REPORT" || fail "fake player assertions failed"
          pass=$(grep -c '^- PASS' "$REPORT" || true)
          test "$pass" -ge 17 || fail "only $pass assertions passed (expected 17)"
          echo "fake player assertions passed: $pass"

      - name: Upload server log
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-log
          path: |
            run/logs/latest.log
            build/smoke-report.txt
          if-no-files-found: warn
