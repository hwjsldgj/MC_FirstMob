# Gradle
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# 不写死 org.gradle.java.home：本机路径写进仓库会让其他机器 / CI 直接构建失败。
# 本地与 CI 都通过 JAVA_HOME 选择 JDK 21（本地见 AGENTS.md「环境与命令」）。

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.20.1
loom_version=1.15.5

# Mod Properties
version=2.0.0
group=com.example.hush

# Dependencies
fabric_api_version=0.116.17+1.21.1

# 国内镜像（Loom 内置的镜像变量，Mojang 直连失败时走 BMCLAPI）
loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
