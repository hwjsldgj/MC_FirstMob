# Gradle
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# 固定使用本机 JDK 21，避免 PATH 上的 Java 8 被误用
org.gradle.java.home=D:/pcl/jdk-21

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.20.1
loom_version=1.15.5

# Mod Properties
version=1.0.0
group=com.example.firstmob

# Dependencies
fabric_api_version=0.116.17+1.21.1

# 国内镜像（Loom 内置的镜像变量，Mojang 直连失败时走 BMCLAPI）
loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
