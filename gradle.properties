# Gradle
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
# 开启本地构建缓存：本机重复构建直接复用产物，CI 里 setup-gradle 会把
# ~/.gradle/caches/build-cache-1 一并缓存，smoke job 不必从零重编。
org.gradle.caching=true
org.gradle.configuration-cache=false
# 不写死 org.gradle.java.home：本机路径写进仓库会让其他机器 / CI 直接构建失败。
# 本地与 CI 都通过 JAVA_HOME 选择 JDK 21（本地见 AGENTS.md「环境与命令」）。

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.20.1
loom_version=1.15.5

# Mod Properties
# 未发布：模组仍在开发阶段，从未发过正式版；-SNAPSHOT 表示构建物不可对外发布。
version=0.1.0-SNAPSHOT
group=com.example.hush

# Dependencies
fabric_api_version=0.116.17+1.21.1

# 国内镜像（Loom 内置的镜像变量，Mojang 直连失败时走 BMCLAPI）
# 注意：BMCLAPI 的 assets 镜像会卡在大体积语言文件上（hal_ua / lt_lt 等 600~770 KB，
# 连接建立后长时间零进度），导致 `runClient` 一直停在 :downloadAssets。
# 实测官方 CDN 可直连且能下完，所以资源单独走官方；库与版本清单仍走 BMCLAPI。
loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
loom_resources_base=https://resources.download.minecraft.net/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
